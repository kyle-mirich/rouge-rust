[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "rouge-rust"
description = "High-performance Rust-backed ROUGE scoring for Python"
requires-python = ">=3.8"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["nlp", "rouge", "evaluation", "rust", "pyo3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/kyle-mirich/rouge-rust"
Repository = "https://github.com/kyle-mirich/rouge-rust"
Issues = "https://github.com/kyle-mirich/rouge-rust/issues"
Documentation = "https://github.com/kyle-mirich/rouge-rust/blob/main/docs/api.md"
Changelog = "https://github.com/kyle-mirich/rouge-rust/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "maturin>=1.12,<2.0",
    "pytest>=8",
    "rouge-score==0.1.2",
    "twine>=6",
    "ruff>=0.12",
]

[tool.maturin]
module-name = "fast_rouge"
include = [
    { path = "docs/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
    { path = "scripts/**", format = "sdist" },
    { path = "fast_rouge.pyi", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
