[package]
name = "fast_rouge"
version = "0.1.12"
edition = "2024"
rust-version = "1.88"
description = "High-performance Rust-backed ROUGE scoring for Python"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/kyle-mirich/rouge-rust"
repository = "https://github.com/kyle-mirich/rouge-rust"
authors = ["Kyle Mirich"]

[lib]
name = "fast_rouge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
rayon = "1.11.0"
rustc-hash = "2.1.1"

[profile.release]
codegen-units = 1
lto = "thin"
